<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReadingMaster 语音交互原型</title>
<style>
  :root {
    --primary:#5EB26A; --primary-dark:#3D8A4F; --primary-soft:#DCEEDD;
    --bg:#F7F6F0; --surface:#FFFFFF; --panel:#EFF5E7;
    --ink:#223B2A; --ink-soft:#61705F; --line:#E5E9DC;
    --gold:#F4B84A; --danger:#E26D6D;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--ink); font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; min-height:100vh; }
  .wrap { max-width:560px; margin:0 auto; padding:20px 16px 48px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:20px; }
  .logo { display:flex; align-items:center; gap:10px; }
  .logo-mark { width:42px; height:42px; border-radius:14px; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; }
  .logo-name { font-size:20px; font-weight:800; line-height:1.1; }
  .logo-sub { font-size:11px; color:var(--ink-soft); letter-spacing:.5px; }
  .tabs { display:flex; background:var(--panel); border-radius:30px; padding:4px; }
  .tab { border:0; background:transparent; padding:10px 14px; border-radius:26px; font-size:14px; font-weight:700; color:var(--ink-soft); cursor:pointer; }
  .tab.active { background:var(--surface); color:var(--primary-dark); box-shadow:0 1px 4px rgba(0,0,0,.08); }
  .page { display:none; }
  .page.active { display:block; }
  .book-chip { display:inline-flex; align-items:center; gap:6px; background:var(--panel); color:var(--primary-dark); padding:7px 14px; border-radius:20px; font-size:13px; font-weight:700; margin-bottom:14px; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:26px 24px; }
  .kicker { color:var(--ink-soft); font-size:13px; margin-bottom:8px; }
  .question { font-size:22px; font-weight:800; line-height:1.45; margin-bottom:8px; }
  .mic-zone { display:flex; flex-direction:column; align-items:center; gap:14px; padding:22px 0 8px; }
  .mic-btn { width:96px; height:96px; border-radius:50%; border:0; background:var(--primary); color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:transform .15s ease; }
  .mic-btn:active { transform:scale(.94); }
  .mic-btn.recording { animation:pulse 1.1s ease-out infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(94,178,106,.45);} 100%{box-shadow:0 0 0 24px rgba(94,178,106,0);} }
  .mic-hint { color:var(--ink-soft); font-size:14px; }
  .status { text-align:center; color:var(--primary-dark); font-weight:700; min-height:24px; margin:12px 0 2px; }
  .transcript { background:var(--panel); border-radius:16px; padding:14px 16px; margin:10px 0; font-size:17px; font-weight:600; color:var(--ink); }
  .result { border-radius:16px; padding:16px; margin-top:10px; }
  .result.correct { background:rgba(94,178,106,.14); border:1px solid rgba(94,178,106,.35); }
  .result.wrong { background:rgba(226,109,109,.10); border:1px solid rgba(226,109,109,.30); }
  .result .head { display:flex; align-items:center; gap:8px; font-weight:800; font-size:16px; margin-bottom:8px; }
  .result.correct .head { color:var(--primary-dark); }
  .result.wrong .head { color:var(--danger); }
  .result p { color:var(--ink); font-size:14px; line-height:1.65; }
  .model { margin-top:8px; font-size:13px; color:var(--ink-soft); }
  .actions { display:flex; gap:10px; margin-top:20px; }
  .btn { flex:1; border:0; border-radius:14px; padding:15px 0; font-size:16px; font-weight:800; cursor:pointer; color:#fff; background:var(--primary); }
  .btn.ghost { background:var(--surface); color:var(--primary-dark); border:1px solid var(--primary); }
  .btn:disabled { opacity:.5; cursor:default; }
  .sentence { font-size:26px; font-weight:800; line-height:1.5; margin-bottom:18px; }
  .play-btn { width:100%; }
  .footer-note { text-align:center; color:var(--ink-soft); font-size:12px; margin-top:18px; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">
      <div class="logo-mark">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      </div>
      <div>
        <div class="logo-name">阅读王</div>
        <div class="logo-sub">ReadingMaster</div>
      </div>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab active" id="tabQuiz" role="tab">语音答题</button>
      <button class="tab" id="tabRead" role="tab">跟读练习</button>
    </div>
  </header>

  <section class="page active" id="quizPage">
    <div class="book-chip">📖 The Little Dog · Level 2</div>
    <div class="card">
      <div class="kicker">第 <span id="qIndex">1</span> / 3 题 · 用你的话说出答案</div>
      <div class="question" id="qText">What does Tom have?</div>

      <div class="mic-zone">
        <button class="mic-btn" id="quizMic" aria-label="说出答案">
          <svg id="quizMicIcon" width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
        </button>
        <div class="mic-hint" id="quizHint">点击麦克风，说出你的答案</div>
      </div>
      <div class="status" id="quizStatus"></div>
      <div class="transcript hidden" id="quizTranscript"></div>
      <div class="result hidden" id="quizResult">
        <div class="head"><span id="quizResultIcon"></span><span id="quizResultTitle"></span></div>
        <p id="quizFeedback"></p>
        <div class="model" id="quizModel"></div>
      </div>
      <div class="actions">
        <button class="btn ghost" id="quizRetry" disabled>重说一遍</button>
        <button class="btn" id="quizNext" disabled>下一题 →</button>
      </div>
    </div>
  </section>

  <section class="page" id="readPage">
    <div class="book-chip">🎙 跟读模式 · 逐句练习</div>
    <div class="card">
      <div class="kicker">第 <span id="sIndex">1</span> / 3 句</div>
      <div class="sentence" id="sText">The dog is very cute.</div>
      <button class="btn ghost play-btn" id="playBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:6px;"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
        再听一遍
      </button>
      <div class="mic-zone">
        <button class="mic-btn" id="readMic" aria-label="跟读">
          <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
        </button>
        <div class="mic-hint" id="readHint">点击麦克风，跟着读一遍</div>
      </div>
      <div class="status" id="readStatus"></div>
      <div class="transcript hidden" id="readTranscript"></div>
      <div class="result hidden" id="readResult">
        <div class="head"><span id="readResultIcon"></span><span id="readResultTitle"></span></div>
        <p id="readFeedback"></p>
      </div>
      <div class="actions">
        <button class="btn ghost" id="readRetry" disabled>再试一次</button>
        <button class="btn" id="readNext" disabled>下一句 →</button>
      </div>
    </div>
  </section>

  <p class="footer-note">交互原型 · 语音为模拟数据，点击麦克风即可体验完整流程</p>
</div>

<script>
(function () {
  'use strict';

  var quizData = [
    {
      q: 'What does Tom have?',
      transcript: 'Tom has a little dog.',
      correct: true,
      feedback: '答对了！Tom 有一只小狗。',
      model: '参考答案：Tom has a little dog.'
    },
    {
      q: 'Where does Tom find his dog?',
      transcript: 'The dog is under the tree.',
      correct: true,
      feedback: '答对了！小狗在树下。',
      model: '参考答案：Tom finds the dog under a tree.'
    },
    {
      q: 'How does Tom feel at the end?',
      transcript: 'Tom is angry.',
      correct: false,
      feedback: '再想想。故事最后 Tom 找到小狗，是很开心的。',
      model: '参考答案：Tom is very happy.'
    }
  ];

  var readData = [
    {
      text: 'The dog is very cute.',
      transcript: 'The dog is very cute.',
      correct: true,
      feedback: '读对了，发音很清楚，真棒！'
    },
    {
      text: 'Tom likes to play with his dog.',
      transcript: 'Tom likes play with his dog.',
      correct: false,
      feedback: '还差一点点，注意读 to，再试一次。',
      model: 'Tom likes to play with his dog.'
    },
    {
      text: 'One day, the dog runs away.',
      transcript: 'One day the dog runs away.',
      correct: true,
      feedback: '读对了！'
    }
  ];

  var quizIndex = 0;
  var readIndex = 0;
  var quizBusy = false;
  var readBusy = false;

  function $(id) { return document.getElementById(id); }

  function switchTab(name) {
    $('quizPage').classList.toggle('active', name === 'quiz');
    $('readPage').classList.toggle('active', name === 'read');
    $('tabQuiz').classList.toggle('active', name === 'quiz');
    $('tabRead').classList.toggle('active', name === 'read');
  }

  function resetQuizCard() {
    $('quizStatus').textContent = '';
    $('quizTranscript').classList.add('hidden');
    $('quizResult').classList.add('hidden');
    $('quizRetry').disabled = true;
    $('quizNext').disabled = true;
    $('quizMic').classList.remove('recording');
    $('quizHint').textContent = '点击麦克风，说出你的答案';
  }

  function resetReadCard() {
    $('readStatus').textContent = '';
    $('readTranscript').classList.add('hidden');
    $('readResult').classList.add('hidden');
    $('readRetry').disabled = true;
    $('readNext').disabled = true;
    $('readMic').classList.remove('recording');
    $('readHint').textContent = '点击麦克风，跟着读一遍';
  }

  function renderQuiz() {
    var item = quizData[quizIndex];
    $('qIndex').textContent = quizIndex + 1;
    $('qText').textContent = item.q;
    resetQuizCard();
  }

  function renderRead() {
    var item = readData[readIndex];
    $('sIndex').textContent = readIndex + 1;
    $('sText').textContent = item.text;
    resetReadCard();
  }

  function startQuizRecording() {
    if (quizBusy) return;
    quizBusy = true;
    $('quizMic').classList.add('recording');
    $('quizHint').textContent = '正在听……';
    $('quizStatus').textContent = '';

    setTimeout(function () {
      $('quizMic').classList.remove('recording');
      $('quizHint').textContent = '正在把你说的话变成文字……';
      $('quizStatus').textContent = '';

      setTimeout(function () {
        var item = quizData[quizIndex];
        $('quizTranscript').textContent = item.transcript;
        $('quizTranscript').classList.remove('hidden');

        var result = $('quizResult');
        result.classList.remove('correct', 'wrong');
        result.classList.add(item.correct ? 'correct' : 'wrong');
        $('quizResultIcon').textContent = item.correct ? '✅' : '💡';
        $('quizResultTitle').textContent = item.correct ? '答对了！' : '再想想';
        $('quizFeedback').textContent = item.feedback;
        $('quizModel').textContent = item.model || '';
        $('quizModel').style.display = item.model ? '' : 'none';
        result.classList.remove('hidden');

        $('quizRetry').disabled = false;
        $('quizNext').disabled = false;
        $('quizHint').textContent = '可以和答案对一对，再进入下一题';
        quizBusy = false;
      }, 900);
    }, 1300);
  }

  function startReadRecording() {
    if (readBusy) return;
    readBusy = true;
    $('readMic').classList.add('recording');
    $('readHint').textContent = '正在听……';
    $('readStatus').textContent = '';

    setTimeout(function () {
      $('readMic').classList.remove('recording');
      $('readHint').textContent = '正在比对发音……';
      $('readStatus').textContent = '';

      setTimeout(function () {
        var item = readData[readIndex];
        $('readTranscript').textContent = item.transcript;
        $('readTranscript').classList.remove('hidden');

        var result = $('readResult');
        result.classList.remove('correct', 'wrong');
        result.classList.add(item.correct ? 'correct' : 'wrong');
        $('readResultIcon').textContent = item.correct ? '✅' : '🤏';
        $('readResultTitle').textContent = item.correct ? '读对了！' : '还差一点';
        $('readFeedback').textContent = item.feedback + (item.model ? ' ' + item.model : '');
        result.classList.remove('hidden');

        $('readRetry').disabled = false;
        $('readNext').disabled = false;
        $('readHint').textContent = '';
        readBusy = false;
      }, 900);
    }, 1300);
  }

  $('tabQuiz').addEventListener('click', function () { switchTab('quiz'); });
  $('tabRead').addEventListener('click', function () { switchTab('read'); });

  $('quizMic').addEventListener('click', startQuizRecording);
  $('quizRetry').addEventListener('click', resetQuizCard);
  $('quizNext').addEventListener('click', function () {
    quizIndex = (quizIndex + 1) % quizData.length;
    renderQuiz();
  });

  $('readMic').addEventListener('click', startReadRecording);
  $('readRetry').addEventListener('click', resetReadCard);
  $('readNext').addEventListener('click', function () {
    readIndex = (readIndex + 1) % readData.length;
    renderRead();
  });

  $('playBtn').addEventListener('click', function () {
    var btn = $('playBtn');
    var original = btn.textContent;
    btn.disabled = true;
    btn.textContent = '正在朗读……';
    setTimeout(function () {
      btn.disabled = false;
      btn.textContent = original;
    }, 1100);
  });

  renderQuiz();
  renderRead();
})();
</script>
</body>
</html>
